<section class="gallery-page">

  <!-- ================================================================
       HERO
       ================================================================= -->
  <app-page-hero
    eyebrow="Discover"
    title="Gallery"
    paragraph="Take a closer look at The Legacy Hotel & Spa and discover the spaces, accommodation and experiences that make every stay special."
  ></app-page-hero>


  <!-- ================================================================
       GALLERY
       ================================================================= -->

  <section class="gallery-page__content">

    <div class="container">


      <!-- Gallery Filters -->

      <div
        class="gallery-filters"
        aria-label="Gallery categories"
      >

        <button
          *ngFor="let category of categories"
          type="button"
          class="gallery-filters__button"
          [class.gallery-filters__button--active]="activeCategory === category.id"
          (click)="selectCategory(category.id)"
        >

          {{ category.name }}

        </button>

      </div>


      <!-- Gallery Grid -->

      <div class="gallery-grid">

        <button
          *ngFor="let image of filteredImages; let i = index"
          type="button"
          class="gallery-item"
          (click)="openLightbox(i)"
        >

          <img
            [src]="image.imageUrl"
            [alt]="image.alt"
            loading="lazy"
          />

        </button>

      </div>


    </div>

  </section>


  <!-- ================================================================
       LIGHTBOX
       ================================================================= -->

  <div
    *ngIf="selectedImage"
    class="gallery-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Image preview"
  >

    <!-- Background -->

    <button
      type="button"
      class="gallery-lightbox__backdrop"
      aria-label="Close image preview"
      (click)="closeLightbox()"
    ></button>


    <!-- Content -->

    <div class="gallery-lightbox__content">


      <!-- Close -->

      <button
        type="button"
        class="gallery-lightbox__close"
        aria-label="Close gallery"
        (click)="closeLightbox()"
      >

        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >

          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

      </button>


      <!-- Previous -->

      <button
        type="button"
        class="gallery-lightbox__nav gallery-lightbox__nav--previous"
        aria-label="Previous image"
        (click)="previousImage()"
      >

        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >

          <path
            d="M15 18l-6-6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

      </button>


      <!-- Image -->

      <figure class="gallery-lightbox__figure">

        <img
          [src]="selectedImage.imageUrl"
          [alt]="selectedImage.alt"
        />

      </figure>


      <!-- Next -->

      <button
        type="button"
        class="gallery-lightbox__nav gallery-lightbox__nav--next"
        aria-label="Next image"
        (click)="nextImage()"
      >

        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >

          <path
            d="M9 18l6-6-6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

      </button>


    </div>

  </div>

</section>
